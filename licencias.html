<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.B.O. Control - Gestión de Licencias</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1b2a; color: #333; padding: 12px; display: flex; justify-content: center; }
        .container { background-color: #f8f9fa; width: 100%; max-width: 480px; border-radius: 20px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .brand h1 { font-size: 17px; color: #00796b; font-weight: 700; }
        .brand p { font-size: 11px; color: #666; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #333; margin-bottom: 4px; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: white; }
        .btn-primary { background-color: #2e7d32; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 4px; transition: background 0.2s; }
        .btn-primary:hover { background-color: #1b5e20; }
        .btn-pdf { background-color: #0277bd; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 8px; text-align: center; }
        .btn-pdf:hover { background-color: #01579b; }
        .btn-volver { background-color: #546e7a; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; display: block; text-align: center; margin-top: 10px; }
        .lista-licencias { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
        .licencia-item { background: white; border: 1px solid #eee; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .licencia-info strong { color: #00796b; display: block; font-size: 13px; }
        .licencia-info p { color: #666; font-size: 11px; margin-top: 2px; }
        
        .acciones-item { display: flex; gap: 4px; align-items: center; }
        .btn-editar { background: #e0f2f1; color: #00796b; border: none; padding: 6px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-editar:hover { background: #b2dfdb; }
        .btn-eliminar { background: #ffebee; color: #c62828; border: none; padding: 6px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-eliminar:hover { background: #ffcdd2; }

        @media print {
            body { background: white !important; padding: 0 !important; }
            .container { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; }
            #formLicencia, .btn-volver, .acciones-item, .btn-pdf { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <h1>Gestión de Licencias</h1>
                <p>S. B. O. Control</p>
            </div>
            <span style="font-size: 24px;">🔑</span>
        </div>

        <form id="formLicencia">
            <div class="form-group">
                <label>1. Nombre y Apellido del Cliente:</label>
                <input type="text" id="txtClienteLicencia" class="form-control" placeholder="Ej: Carlos Gómez" required>
            </div>
            <div class="form-group">
                <label>2. Nombre de la Licencia:</label>
                <input type="text" id="txtNombreLicencia" class="form-control" placeholder="Ej: Licencia Anual Ferias" required>
            </div>
            <div class="form-group">
                <label>3. Duración:</label>
                <input type="text" id="txtDuracion" class="form-control" placeholder="Ej: 365 días / 1 año" required>
            </div>
            <button type="submit" class="btn-primary" id="btnGuardar">💾 Generar y Guardar Licencia</button>
        </form>

        <h3 style="font-size: 14px; color: #0d47a1; margin-top: 16px; margin-bottom: 8px;">Listado Registrado</h3>
        <div class="lista-licencias" id="contenedorLicencias">
            <!-- Se carga dinámicamente -->
        </div>

        <button class="btn-pdf" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
        <a href="menu.html" class="btn-volver">⬅️ Volver al Menú</a>
    </div>

    <script>
        let editandoId = null;

        document.addEventListener('DOMContentLoaded', cargarLicencias);

        function generarClaveParaCliente(nombreCliente, nombreLicencia) {
            // Extraer iniciales del cliente (Ej: "Carlos Gómez" -> "CG")
            const palabrasCliente = nombreCliente.trim().toUpperCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .split(/\s+/);
            const inicialesCliente = palabrasCliente.map(p => p[0]).join('');
            const prefijo = `K${inicialesCliente}`;

            // Extraer abreviatura de la licencia (Ej: "Licencia Anual Ferias" -> "LAF")
            const palabrasLicencia = nombreLicencia.trim().toUpperCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .split(/\s+/);
            
            const ignorar = ["DE", "LA", "EL", "LOS", "LAS", "Y", "A", "POR", "UN", "UNA"];
            const acronimoLicencia = palabrasLicencia
                .filter(p => !ignorar.includes(p))
                .map(p => p[0])
                .join('');
            
            const random = Math.floor(100 + Math.random() * 900);
            return `${prefijo}-${acronimoLicencia}-${random}`;
        }

        document.getElementById('formLicencia').addEventListener('submit', function(e) {
            e.preventDefault();
            const clienteLicencia = document.getElementById('txtClienteLicencia').value.trim();
            const nombreLicencia = document.getElementById('txtNombreLicencia').value.trim();
            const duracion = document.getElementById('txtDuracion').value.trim();

            let licencias = JSON.parse(localStorage.getItem('sbo_db_licencias_personalizadas')) || [];
            
            if (editandoId !== null) {
                licencias = licencias.map(l => {
                    if (l.id === editandoId) {
                        return { ...l, clienteLicencia, nombreLicencia, duracion };
                    }
                    return l;
                });
                editandoId = null;
                document.getElementById('btnGuardar').innerText = '💾 Generar y Guardar Licencia';
                document.getElementById('btnGuardar').style.backgroundColor = '#2e7d32';
                alert('¡Licencia actualizada con éxito!');
            } else {
                const clave = generarClaveParaCliente(clienteLicencia, nombreLicencia);
                licencias.push({
                    id: Date.now(),
                    clienteLicencia,
                    nombreLicencia,
                    duracion,
                    clave,
                    activa: true,
                    mostrar: true,
                    seleccionable: true
                });
                alert('¡Licencia generada con las iniciales del cliente y guardada!');
            }

            localStorage.setItem('sbo_db_licencias_personalizadas', JSON.stringify(licencias));
            
            this.reset();
            cargarLicencias();
        });

        function cargarLicencias() {
            const contenedor = document.getElementById('contenedorLicencias');
            const licencias = JSON.parse(localStorage.getItem('sbo_db_licencias_personalizadas')) || [];

            if (licencias.length === 0) {
                contenedor.innerHTML = '<div style="text-align:center; color:#666; font-size:12px; padding:10px;">No hay licencias cargadas todavía.</div>';
                return;
            }

            let html = '';
            licencias.forEach(l => {
                html += `
                    <div class="licencia-item">
                        <div class="licencia-info">
                            <strong>${l.nombreLicencia} (${l.clienteLicencia})</strong>
                            <p>Duración: ${l.duracion} | Clave: <code>${l.clave}</code></p>
                        </div>
                        <div class="acciones-item">
                            <button class="btn-editar" onclick="editarLicencia(${l.id})" title="Editar">✏️</button>
                            <button class="btn-eliminar" onclick="eliminarLicencia(${l.id})" title="Eliminar">✕</button>
                        </div>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
        }

        window.editarLicencia = function(id) {
            let licencias = JSON.parse(localStorage.getItem('sbo_db_licencias_personalizadas')) || [];
            let lic = licencias.find(l => l.id === id);
            if (!lic) return;

            document.getElementById('txtClienteLicencia').value = lic.clienteLicencia || '';
            document.getElementById('txtNombreLicencia').value = lic.nombreLicencia;
            document.getElementById('txtDuracion').value = lic.duracion;
            
            editandoId = id;
            const btn = document.getElementById('btnGuardar');
            btn.innerText = '✏️ Actualizar Licencia';
            btn.style.backgroundColor = '#0277bd';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.eliminarLicencia = function(id) {
            if(!confirm('¿Estás seguro de eliminar esta licencia?')) return;
            let licencias = JSON.parse(localStorage.getItem('sbo_db_licencias_personalizadas')) || [];
            licencias = licencias.filter(l => l.id !== id);
            localStorage.setItem('sbo_db_licencias_personalizadas', JSON.stringify(licencias));
            
            if (editandoId === id) {
                editandoId = null;
                document.getElementById('formLicencia').reset();
                document.getElementById('btnGuardar').innerText = '💾 Generar y Guardar Licencia';
                document.getElementById('btnGuardar').style.backgroundColor = '#2e7d32';
            }

            cargarLicencias();
        };
    </script>
</body>
</html>
