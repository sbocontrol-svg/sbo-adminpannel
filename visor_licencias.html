<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.B.O. Control - Visor de Licencias</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0d1b2a; 
            color: #333; 
            padding: 12px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .app-card { 
            background: #f8f9fa; 
            width: 100%; 
            max-width: 480px; 
            border-radius: 18px; 
            padding: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            max-height: 94vh; 
        }
        h2 { text-align: center; font-size: 18px; color: #00796b; font-weight: 700; }
        
        .file-upload-btn { 
            background: #00796b; 
            color: #fff; 
            padding: 12px; 
            border-radius: 10px; 
            text-align: center; 
            font-size: 13px; 
            font-weight: 700; 
            cursor: pointer; 
            display: block; 
        }
        input[type="file"] { display: none; }

        .status-bar { text-align: center; font-size: 12px; color: #555; font-weight: 600; }
        
        .table-wrapper { 
            width: 100%; 
            max-height: 52vh; 
            overflow: auto; 
            background: #ffffff; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
        }
        table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
        th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #00796b; color: #fff; position: sticky; top: 0; z-index: 1; }
        tr:nth-child(even) { background: #f9f9f9; }

        .action-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-edit {
            background: #f57c00;
            color: white;
            border: none;
            padding: 6px 8px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-delete-item {
            background: #c62828;
            color: white;
            border: none;
            padding: 6px 8px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
        .btn { 
            background: #0277bd; 
            color: #fff; 
            border: none; 
            padding: 11px; 
            font-size: 13px; 
            font-weight: 700; 
            border-radius: 8px; 
            text-align: center; 
            text-decoration: none; 
            cursor: pointer; 
        }
        .btn-danger { background: #c62828; }
        .btn-secondary { background: #546e7a; }

        /* Modal Formulario de Edición */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 12px;
        }
        .modal-card {
            background: #fff; width: 100%; max-width: 440px; border-radius: 16px; padding: 16px;
            max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
        }
        .modal-card h3 { color: #00796b; font-size: 16px; text-align: center; margin-bottom: 6px; }
        .modal-card label { font-size: 11px; font-weight: bold; color: #333; margin-top: 4px; }
        .modal-card input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 12px; }
        .modal-btns { display: flex; gap: 8px; margin-top: 12px; }
        .btn-save-modal { background: #2e7d32; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: bold; cursor: pointer; }
        .btn-cancel-modal { background: #c62828; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: bold; cursor: pointer; }

        @media print {
            body { background: #fff; padding: 0; }
            .app-card { box-shadow: none; max-width: 100%; max-height: none; padding: 0; }
            .file-upload-btn, .btn-group, .status-bar, input, .modal-overlay, .btn-edit, .btn-delete-item { display: none !important; }
            .table-wrapper { max-height: none; border: none; overflow: visible; }
            th, td { border: 1px solid #000; padding: 6px; }
        }
    </style>
</head>
<body>

    <div class="app-card">
        <h2>Licencias Registradas</h2>

        <label class="file-upload-btn" for="fileInput">
            📁 Cargar / Sumar Licencias (.json)
        </label>
        <input type="file" id="fileInput" multiple accept="*/*" onchange="cargarArchivos(event)">

        <div id="status" class="status-bar">Cargando licencias...</div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Acción</th>
                        <th>Licencia</th>
                        <th>Duración</th>
                        <th>Modalidad / Cuotas</th>
                        <th>Precio ($)</th>
                    </tr>
                </thead>
                <tbody id="tablaBody"></tbody>
            </table>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
            <button class="btn btn-danger" onclick="limpiarBase()">🗑️ Vaciar Lista</button>
            <a href="licencias.html" class="btn btn-secondary">⬅️ Volver a Gestión de Licencias</a>
        </div>
    </div>

    <!-- Modal para Editar Licencia -->
    <div id="modalEditar" class="modal-overlay">
        <div class="modal-card">
            <h3>✏️ Editar Licencia</h3>
            
            <label>Nombre de la Licencia:</label>
            <input type="text" id="editNombre">

            <label>Duración:</label>
            <input type="text" id="editDuracion">

            <label>Modalidad / Cuotas:</label>
            <input type="text" id="editModalidad" placeholder="Ej: 1 pago / 2 pagos / 3 cuotas">

            <label>Precio / Costo ($):</label>
            <input type="number" id="editPrecio">

            <div class="modal-btns">
                <button class="btn-save-modal" onclick="guardarEdicion()">💾 Guardar Cambios</button>
                <button class="btn-cancel-modal" onclick="cerrarModal()">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const DB_KEY = 'sbo_db_licencias_personalizadas';
        let licencias = [];
        let editIndex = null;

        document.addEventListener('DOMContentLoaded', () => {
            obtenerGuardados();
            renderizar();
        });

        function obtenerGuardados() {
            try {
                const data = localStorage.getItem(DB_KEY);
                if (data) {
                    licencias = JSON.parse(data) || [];
                }
            } catch (err) {
                console.error("Error al leer memoria de licencias:", err);
            }
        }

        function guardar() {
            localStorage.setItem(DB_KEY, JSON.stringify(licencias));
        }

        function cargarArchivos(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            let leidos = 0;

            for (let i = 0; i < files.length; i++) {
                const f = files[i];
                const reader = new FileReader();

                reader.onload = function(e) {
                    try {
                        const json = JSON.parse(e.target.result.trim());
                        procesarObjeto(json);
                        guardar();
                    } catch (err) {
                        alert("⚠️ Error al leer el archivo de licencia JSON");
                    }

                    leidos++;
                    if (leidos === files.length) {
                        renderizar();
                    }
                };

                reader.readAsText(f);
            }
            event.target.value = '';
        }

        function procesarObjeto(data) {
            if (Array.isArray(data)) {
                data.forEach(item => agregarRegistro(item));
            } else if (typeof data === 'object') {
                agregarRegistro(data);
            }
        }

        function agregarRegistro(item) {
            if (!item || typeof item !== 'object') return;

            const l = {
                id: item.id || Date.now(),
                nombreLicencia: item.nombreLicencia || item.nombre || '-',
                duracion: item.duracion || '-',
                modalidad: item.modalidad || item.cuotas || '-',
                precio: item.precio || item.costo || 0
            };

            const existe = licencias.some(elem => 
                elem.nombreLicencia.toLowerCase() === l.nombreLicencia.toLowerCase() && elem.duracion === l.duracion
            );

            if (!existe) {
                licencias.push(l);
            }
        }

        function renderizar() {
            const tbody = document.getElementById('tablaBody');
            const status = document.getElementById('status');
            tbody.innerHTML = '';

            if (licencias.length === 0) {
                status.innerText = "Sin licencias guardadas.";
                return;
            }

            licencias.forEach((l, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="action-btns">
                            <button class="btn-edit" title="Editar" onclick="abrirModalEditar(${index})">✏️</button>
                            <button class="btn-delete-item" title="Eliminar" onclick="eliminarRegistro(${index})">🗑️</button>
                        </div>
                    </td>
                    <td><strong>${l.nombreLicencia}</strong></td>
                    <td>${l.duracion}</td>
                    <td>${l.modalidad || '-'}</td>
                    <td>$${l.precio}</td>
                `;
                tbody.appendChild(tr);
            });

            status.innerText = `Total licencias: ${licencias.length}`;
        }

        /* Lógica para eliminar registro individual */
        function eliminarRegistro(index) {
            const licencia = licencias[index];
            const nombre = licencia ? licencia.nombreLicencia : 'esta licencia';
            if (confirm(`¿Estás seguro de eliminar la licencia "${nombre}"?`)) {
                licencias.splice(index, 1);
                guardar();
                renderizar();
            }
        }

        /* Lógica del Modal */
        function abrirModalEditar(index) {
            editIndex = index;
            const l = licencias[index];

            document.getElementById('editNombre').value = l.nombreLicencia !== '-' ? l.nombreLicencia : '';
            document.getElementById('editDuracion').value = l.duracion !== '-' ? l.duracion : '';
            document.getElementById('editModalidad').value = l.modalidad && l.modalidad !== '-' ? l.modalidad : '';
            document.getElementById('editPrecio').value = l.precio || 0;

            document.getElementById('modalEditar').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalEditar').style.display = 'none';
            editIndex = null;
        }

        function guardarEdicion() {
            if (editIndex === null) return;

            licencias[editIndex] = {
                id: licencias[editIndex].id || Date.now(),
                nombreLicencia: document.getElementById('editNombre').value.trim() || '-',
                duracion: document.getElementById('editDuracion').value.trim() || '-',
                modalidad: document.getElementById('editModalidad').value.trim() || '-',
                precio: parseFloat(document.getElementById('editPrecio').value) || 0
            };

            guardar();
            renderizar();
            cerrarModal();
        }

        function limpiarBase() {
            if (confirm("¿Vaciar el listado de licencias?")) {
                licencias = [];
                localStorage.removeItem(DB_KEY);
                renderizar();
            }
        }
    </script>
</body>
</html>
