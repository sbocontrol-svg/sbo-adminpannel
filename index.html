<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador S.B.O. Control</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1b2a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1b2a; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-size: 18px; }
        .modal-content { background: #f8f9fa; width: 100%; max-width: 440px; padding: 28px; border-radius: 20px; text-align: left; box-shadow: 0 6px 25px rgba(0,0,0,0.5); }
        .modal-content h2 { font-size: 20px; color: #0d47a1; margin-bottom: 16px; text-align: center; font-weight: 800; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 15px; font-weight: 700; color: #333; margin-bottom: 8px; }
        .input-con-icono { display: flex; gap: 8px; }
        .form-control { width: 100%; padding: 14px; border: 2px solid #ccc; border-radius: 10px; font-size: 18px; font-weight: bold; color: #0d1b2a; }
        .btn-toggle { background: #e0f2f1; border: 2px solid #ccc; border-radius: 10px; padding: 0 16px; cursor: pointer; font-size: 22px; }
        .btn-ingresar { background-color: #2e7d32; color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 10px rgba(46,125,50,0.3); }
        .error-msg { color: #c62828; font-size: 14px; text-align: center; margin-top: 12px; font-weight: 700; display: none; }
    </style>
</head>
<body>
    <div class="modal-content">
        <h2>🔐 Acceso Restringido S.B.O.</h2>
        <div class="form-group">
            <label>Clave Maestra (Visible):</label>
            <div class="input-con-icono">
                <!-- Cambiado de type="password" a type="text" y precargada la clave -->
                <input type="text" id="txtClaveMaestra" class="form-control" value="2016" placeholder="Clave exclusiva..." required>
                <button type="button" id="btnToggle" class="btn-toggle" onclick="togglePassword()" title="Bloquear / Desbloquear vista">🔒</button>
            </div>
        </div>
        <button class="btn-ingresar" onclick="verificarClave()">🔓 Ingresar al Sistema</button>
        <div id="errorMsg" class="error-msg">Clave incorrecta, mi amor. Probá de nuevo.</div>
    </div>

    <script>
        const CLAVE_MAESTRA_SECRETA = "2016";

        function togglePassword() {
            const input = document.getElementById('txtClaveMaestra');
            const btn = document.getElementById('btnToggle');
            if (input.type === 'text') {
                input.type = 'password';
                btn.innerText = '👁️';
            } else {
                input.type = 'text';
                btn.innerText = '🔒';
            }
        }

        function verificarClave() {
            const claveIngresada = document.getElementById('txtClaveMaestra').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (claveIngresada === CLAVE_MAESTRA_SECRETA) {
                sessionStorage.setItem('sbo_auth', 'true');
                window.location.href = 'menu.html';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('txtClaveMaestra').value = '';
            }
        }

        // Registro del Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log("Service Worker registrado con éxito"))
                    .catch((err) => console.log("Fallo el registro", err));
            });
        }
    </script>
</body>
</html>
