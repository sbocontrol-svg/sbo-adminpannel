<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.B.O. Control - Backup General</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0d1b2a; 
            color: #333; 
            padding: 12px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .app-card { 
            background: #f8f9fa; 
            width: 100%; 
            max-width: 480px; 
            border-radius: 18px; 
            padding: 20px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }
        h2 { text-align: center; font-size: 18px; color: #00796b; font-weight: 700; }
        
        .info-box {
            background: #e0f2f1;
            border: 1px solid #b2dfdb;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            color: #004d40;
            line-height: 1.4;
        }

        .status-bar { 
            text-align: center; 
            font-size: 12px; 
            color: #555; 
            font-weight: 600; 
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        
        .file-upload-btn { 
            background: #2e7d32; 
            color: #fff; 
            padding: 12px; 
            border-radius: 10px; 
            text-align: center; 
            font-size: 13px; 
            font-weight: 700; 
            cursor: pointer; 
            display: block; 
        }
        input[type="file"] { display: none; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn { 
            background: #00796b; 
            color: #fff; 
            border: none; 
            padding: 12px; 
            font-size: 13px; 
            font-weight: 700; 
            border-radius: 8px; 
            text-align: center; 
            text-decoration: none; 
            cursor: pointer; 
        }
        .btn-danger { background: #c62828; }
        .btn-secondary { background: #546e7a; }
    </style>
</head>
<body>

    <div class="app-card">
        <h2>Backup General de Datos</h2>

        <div class="info-box">
            🛡️ <strong>Copia de seguridad total:</strong> Exportá en un solo archivo todos los clientes, licencias y presupuestos guardados en este dispositivo. Podés guardarlo en Drive o pasártelo por WhatsApp para tenerlo seguro.
        </div>

        <div id="status" class="status-bar">Analizando memoria local...</div>

        <div class="btn-group">
            <button class="btn" onclick="exportarBackup()">📥 Descargar Backup Completo (.json)</button>
            
            <label class="file-upload-btn" for="fileInput">
                📤 Restaurar Backup desde Archivo
            </label>
            <input type="file" id="fileInput" accept=".json" onchange="importarBackup(event)">

            <button class="btn btn-danger" onclick="limpiarTodo()">🗑️ Borrar Todos los Datos</button>
            <a href="menu.html" class="btn btn-secondary">⬅️ Volver al Panel Principal</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            actualizarEstado();
        });

        function obtenerDatosSBO() {
            const backupData = {};
            let contador = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sbo_')) {
                    try {
                        backupData[key] = JSON.parse(localStorage.getItem(key));
                        contador++;
                    } catch (e) {
                        backupData[key] = localStorage.getItem(key);
                        contador++;
                    }
                }
            }
            return { backupData, contador };
        }

        function actualizarEstado() {
            const { contador } = obtenerDatosSBO();
            const status = document.getElementById('status');
            if (contador > 0) {
                status.innerText = `Estado: ${contador} registros/tablas S.B.O. detectados en memoria.`;
            } else {
                status.innerText = "No hay datos de S.B.O. almacenados actualmente.";
            }
        }

        function exportarBackup() {
            const { backupData, contador } = obtenerDatosSBO();
            if (contador === 0) {
                alert("⚠️ No hay datos para exportar.");
                return;
            }

            const fechaStr = new Date().toISOString().slice(0, 10);
            const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `SBO_Control_Backup_${fechaStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importarBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let texto = e.target.result;
                    if (texto.charCodeAt(0) === 0xFEFF) {
                        texto = texto.slice(1);
                    }
                    const data = JSON.parse(texto.trim());

                    if (typeof data === 'object' && data !== null) {
                        let restaurados = 0;
                        for (const [key, value] of Object.entries(data)) {
                            if (key.startsWith('sbo_')) {
                                localStorage.setItem(key, JSON.stringify(value));
                                restaurados++;
                            }
                        }
                        alert(`¡Éxito! Se restauraron ${restaurados} módulos correctamente.`);
                        actualizarEstado();
                    } else {
                        alert("⚠️ El archivo seleccionado no es un backup válido.");
                    }
                } catch (err) {
                    alert("⚠️ Error al procesar el archivo de respaldo.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function limpiarTodo() {
            if (confirm("⚠️ ¿Estás completamente seguro de vaciar TODA la base de datos del sistema? Esta acción eliminará clientes, licencias y presupuestos guardados en este navegador.")) {
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('sbo_')) {
                        keysToRemove.push(key);
                    }
                }
                keysToRemove.forEach(k => localStorage.removeItem(k));
                actualizarEstado();
                alert("Se ha vaciado la memoria del sistema.");
            }
        }
    </script>
</body>
</html>
