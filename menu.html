<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.B.O. Control - Menú Principal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1b2a; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #f8f9fa; width: 100%; max-width: 480px; border-radius: 24px; padding: 24px 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 2px solid #eee; padding-bottom: 16px; }
        .brand h1 { font-size: 20px; color: #00796b; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .brand h1 .ruedita-chica { font-size: 16px; opacity: 0.8; }
        .brand p { font-size: 14px; color: #555; margin-top: 4px; font-weight: 600; }
        .logo-sbo { height: 48px; width: auto; object-fit: contain; }
        
        .menu-list { display: flex; flex-direction: column; gap: 14px; }
        
        .menu-btn { color: white; border: none; width: 100%; padding: 18px 20px; border-radius: 16px; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: space-between; transition: transform 0.1s ease, background 0.2s; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
        .menu-btn:active { transform: scale(0.97); opacity: 0.9; }
        .menu-btn span.arrow { font-size: 16px; opacity: 0.9; font-weight: 800; }

        .btn-alta { background-color: #2e7d32; }
        .btn-licencias { background-color: #0277bd; }
        .btn-presupuesto { background-color: #5c6b73; }
        .btn-speech { background-color: #00796b; }
        .btn-backup { background-color: #6a1b9a; }
        .btn-bloquear { background-color: #c62828; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand">
                <h1><span class="ruedita-chica">⚙️</span> S. B. O. Control</h1>
                <p>Menú de Administración Principal</p>
            </div>
            <img src="sbologo.png" alt="SBO Logo" class="logo-sbo">
        </div>

        <div class="menu-list">
            <a href="alta_cliente.html" class="menu-btn btn-alta">
                <span>👤 Alta Cliente</span>
                <span class="arrow">➔</span>
            </a>
            <a href="licencias.html" class="menu-btn btn-licencias">
                <span>🔑 Licencias</span>
                <span class="arrow">➔</span>
            </a>
            <a href="presupuesto.html" class="menu-btn btn-presupuesto">
                <span>📊 Presupuesto</span>
                <span class="arrow">➔</span>
            </a>
            <a href="guia.html" class="menu-btn btn-speech">
                <span>💬 Speech y Guía Comercial</span>
                <span class="arrow">➔</span>
            </a>
            <a href="backup.html" class="menu-btn btn-backup">
                <span>🛡️ Backup y Restauración</span>
                <span class="arrow">➔</span>
            </a>
            
            <a href="index.html" class="menu-btn btn-bloquear">
                <span>🔒 Bloquear Sistema</span>
                <span class="arrow">✖</span>
            </a>
        </div>
    </div>

</body>
</html>
