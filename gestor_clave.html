<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.B.O. Control - Gestor de Claves</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1b2a; color: #333; padding: 12px; display: flex; justify-content: center; }
        .container { background-color: #f8f9fa; width: 100%; max-width: 480px; border-radius: 20px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .brand h1 { font-size: 17px; color: #00796b; font-weight: 700; }
        .brand p { font-size: 11px; color: #666; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #333; margin-bottom: 4px; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: white; }
        .btn-select { background: #00796b; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 4px; }
        .btn-select:hover { background: #004d40; }
        .btn-volver { background-color: #546e7a; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; display: block; text-align: center; margin-top: 10px; }
        .lista-claves { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
        .clave-item { background: white; border: 1px solid #eee; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .clave-info strong { color: #00796b; display: block; font-size: 13px; }
        .clave-info p { color: #666; font-size: 11px; margin-top: 2px; }
        .btn-eliminar { background: #ffebee; color: #c62828; border: none; padding: 6px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-eliminar:hover { background: #ffcdd2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <h1>Gestor de Claves</h1>
                <p>S. B. O. Control</p>
            </div>
            <span style="font-size: 24px;">🔑</span>
        </div>

        <div class="form-group">
            <label>Nombre y Apellido del Cliente (Opcional):</label>
            <input type="text" id="nombreCliente" class="form-control" placeholder="Ej: Juan Manuel Benitez">
        </div>

        <div class="form-group">
            <label>Tipo de Licencia:</label>
            <select id="selLicencia" class="form-control">
                <option value="">Cargando licencias...</option>
            </select>
        </div>

        <button class="btn-select" onclick="crearClave()">💾 Crear Clave</button>

        <h3 style="font-size: 14px; color: #0d47a1; margin-top: 16px; margin-bottom: 8px;">Claves Creadas</h3>
        <div class="lista-claves" id="contenedorClaves">
            <!-- Se carga dinámicamente -->
        </div>

        <a href="menu.html" class="btn-volver">⬅️ Volver al Menú</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarSelectLicencias();
            cargarClavesCreadas();
        });

        function cargarSelectLicencias() {
            const select = document.getElementById('selLicencia');
            const licencias = JSON.parse(localStorage.getItem('sbo_db_licencias_personalizadas')) || [];

            if (licencias.length === 0) {
                select.innerHTML = '<option value="">No hay licencias cargadas en el sistema</option>';
                return;
            }

            let html = '<option value="">Seleccioná una licencia...</option>';
            licencias.forEach(l => {
                html += `<option value="${l.nombreLicencia}">${l.nombreLicencia}</option>`;
            });
            select.innerHTML = html;
        }

        function crearClave() {
            const select = document.getElementById('selLicencia');
            const nombreLicencia = select.value;
            const clienteInput = document.getElementById('nombreCliente').value.trim();
            
            if (!nombreLicencia) {
                alert("¡Che, elegí una licencia del desplegable!");
                return;
            }

            const palabras = nombreLicencia.trim().toUpperCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .split(/\s+/);
            const ignorar = ["DE", "LA", "EL", "LOS", "LAS", "Y", "A", "POR", "UN", "UNA"];
            const acronimo = palabras.filter(p => !ignorar.includes(p)).map(p => p[0]).join('');
            const random = Math.floor(100 + Math.random() * 900);
            const clave = `K-${acronimo}-${random}`;

            const clienteFinal = clienteInput || "Sin nombre";

            let clavesCreadas = JSON.parse(localStorage.getItem('sbo_db_claves_creadas')) || [];
            clavesCreadas.unshift({
                id: Date.now(),
                cliente: clienteFinal,
                licencia: nombreLicencia,
                clave: clave
            });

            localStorage.setItem('sbo_db_claves_creadas', JSON.stringify(clavesCreadas));

            document.getElementById('nombreCliente').value = '';
            select.value = '';
            cargarClavesCreadas();
            alert("¡Clave creada y guardada en el listado con éxito!");
        }

        function cargarClavesCreadas() {
            const contenedor = document.getElementById('contenedorClaves');
            const claves = JSON.parse(localStorage.getItem('sbo_db_claves_creadas')) || [];

            if (claves.length === 0) {
                contenedor.innerHTML = '<div style="text-align:center; color:#666; font-size:12px; padding:10px;">No hay claves creadas todavía.</div>';
                return;
            }

            let html = '';
            claves.forEach(c => {
                html += `
                    <div class="clave-item">
                        <div class="clave-info">
                            <strong>${c.cliente} (${c.licencia})</strong>
                            <p>Clave: <code>${c.clave}</code></p>
                        </div>
                        <button class="btn-eliminar" onclick="eliminarClave(${c.id})" title="Eliminar">✕</button>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
        }

        window.eliminarClave = function(id) {
            if(!confirm('¿Estás seguro de eliminar esta clave de la lista?')) return;
            let claves = JSON.parse(localStorage.getItem('sbo_db_claves_creadas')) || [];
            claves = claves.filter(c => c.id !== id);
            localStorage.setItem('sbo_db_claves_creadas', JSON.stringify(claves));
            cargarClavesCreadas();
        };
    </script>
</body>
</html>
