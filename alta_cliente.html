<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.B.O. Control - Alta de Cliente</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1b2a; color: #333; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #f8f9fa; width: 100%; max-width: 480px; border-radius: 20px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .brand h1 { font-size: 17px; color: #00796b; font-weight: 700; }
        .brand p { font-size: 11px; color: #666; }
        
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #333; margin-bottom: 4px; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: white; }
        .form-row { display: flex; gap: 8px; }
        .form-row .form-group { flex: 1; }
        
        .btn-primary { background-color: #2e7d32; color: white; border: none; width: 100%; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 4px; }
        .btn-primary:hover { background-color: #1b5e20; }
        .btn-generar { background-color: #00796b; color: white; border: none; padding: 0 12px; border-radius: 8px; font-weight: bold; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .btn-generar:hover { background-color: #004d40; }
        .btn-cargar-json { background-color: #374151; color: white; border: none; padding: 0 10px; border-radius: 8px; font-weight: bold; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .btn-cargar-json:hover { background-color: #1f2937; }
        .btn-historial { background-color: #374151; color: white; border: none; width: 100%; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .btn-historial:hover { background-color: #1f2937; }
        .btn-pdf { background-color: #0277bd; color: white; border: none; width: 100%; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 8px; text-align: center; text-decoration: none; display: block; }
        .btn-pdf:hover { background-color: #01579b; }
        .btn-volver { background-color: #546e7a; color: white; border: none; width: 100%; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; display: block; text-align: center; margin-top: 8px; }

        /* Estilos del Modal Flotante */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
        .modal-content { background: white; padding: 16px; border-radius: 14px; width: 100%; max-width: 440px; max-height: 82vh; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00796b; padding-bottom: 8px; margin-bottom: 12px; }
        .modal-header h3 { font-size: 15px; color: #00796b; margin: 0; font-weight: 700; }
        .btn-cerrar-x { background: none; border: none; font-size: 18px; font-weight: bold; color: #666; cursor: pointer; padding: 0 4px; }
        
        .lista-clientes { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 4px; max-height: 55vh; }
        .cliente-item { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: flex-start; font-size: 12px; }
        .cliente-info strong { color: #00796b; display: block; font-size: 13px; margin-bottom: 2px; }
        .cliente-info p { color: #4b5563; font-size: 11px; margin-top: 2px; line-height: 1.3; }
        .btn-eliminar { background: #fee2e2; color: #dc2626; border: none; padding: 5px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; margin-left: 6px; }
        .btn-eliminar:hover { background: #fca5a5; }

        @media print {
            body { background: white !important; padding: 0 !important; }
            .container { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; }
            #formCliente, .btn-volver, .btn-eliminar, .btn-pdf, .btn-historial { display: none !important; }
            .modal-overlay { position: static !important; background: none !important; display: block !important; padding: 0 !important; }
            .modal-content { max-height: none !important; box-shadow: none !important; border: none !important; padding: 0 !important; }
            .btn-cerrar-x, .modal-header h3 { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <h1>Alta de Cliente</h1>
                <p>S. B. O. Control</p>
            </div>
            <span style="font-size: 24px;">👤</span>
        </div>

        <form id="formCliente">
            <div class="form-group">
                <label>1. Nombre y Apellido del Cliente:</label>
                <input type="text" id="txtNombreCliente" class="form-control" placeholder="Ej: Carlos Gómez" required>
            </div>
            <div class="form-group">
                <label>2. WhatsApp / Contacto:</label>
                <input type="text" id="txtContacto" class="form-control" value="2364xxxxxx" placeholder="Ej: 2364xxxxxx" required>
            </div>
            <div class="form-group">
                <label>3. Correo Electrónico (E-mail):</label>
                <input type="email" id="txtEmail" class="form-control" placeholder="Ej: cliente@email.com">
            </div>
            <div class="form-group">
                <label>4. Domicilio / Ciudad:</label>
                <input type="text" id="txtDomicilio" class="form-control" placeholder="Ej: Av. San Martín 123, Junín" required>
            </div>
            <div class="form-group">
                <label>5. Huella de Hardware (HW del Cliente):</label>
                <input type="text" id="txtHardware" class="form-control" placeholder="Ej: HW-M7PRTS (Opcional o pegar la enviada por WhatsApp)">
            </div>
            <div class="form-group">
                <label>6. Tipo de Licencia:</label>
                <div style="display: flex; gap: 6px;">
                    <select id="selLicenciaAsignada" class="form-control" required>
                        <option value="">Cargando licencias...</option>
                    </select>
                    <input type="file" id="inputImportarLicencia" accept=".json,.sbo" style="display: none;" onchange="cargarLicenciaDesdeArchivo(event)">
                    <button type="button" class="btn-cargar-json" onclick="document.getElementById('inputImportarLicencia').click()">📂 Cargar JSON</button>
                </div>
            </div>
            <div class="form-group">
                <label>7. Clave de Licencia:</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="txtClaveLicencia" class="form-control" placeholder="Ej: LAM-M7PR-CG" style="text-transform: uppercase;">
                    <button type="button" class="btn-generar" onclick="generarClaveAlta()">⚙️ Generar</button>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>8. Desde la Fecha:</label>
                    <input type="date" id="txtFechaInicio" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>9. Hasta la Fecha:</label>
                    <input type="date" id="txtFechaFin" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn-primary">💾 Registrar Cliente y Generar Archivo .sbo</button>
        </form>

        <button type="button" class="btn-historial" onclick="abrirModalClientes()">👥 Ver Clientes Registrados</button>
        <a href="visor_clientes.html" class="btn-pdf"> Listado de Clientes</a>
        <a href="menu.html" class="btn-volver">⬅️ Volver al Menú</a>
    </div>

    <!-- Modal Flotante de Clientes Registrados -->
    <div id="modalClientes" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>👥 Clientes Registrados</h3>
                <button type="button" class="btn-cerrar-x" onclick="cerrarModalClientes()">✕</button>
            </div>
            <div class="lista-clientes" id="contenedorClientes">
                <!-- Se carga dinámicamente -->
            </div>
            <button type="button" class="btn-historial" style="margin-top: 12px; background:#00796b;" onclick="cerrarModalClientes()">Cerrar</button>
        </div>
    </div>

    <script>
        let ultimoArchivoBlob = null;
        let ultimoNombreArchivo = "";

        document.addEventListener('DOMContentLoaded', () => {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('txtFechaInicio').value = hoy;
            
            cargarSelectLicencias();
            cargarClientes();

            document.getElementById('selLicenciaAsignada').addEventListener('change', function() {
                const opt = this.options[this.selectedIndex];
                const clave = opt ? opt.getAttribute('data-clave') : '';
                if(clave) {
                    document.getElementById('txtClaveLicencia').value = clave;
                }
            });
        });

        function abrirModalClientes() {
            cargarClientes();
            document.getElementById('modalClientes').style.display = 'flex';
        }

        function cerrarModalClientes() {
            document.getElementById('modalClientes').style.display = 'none';
        }

        function cargarSelectLicencias() {
            const select = document.getElementById('selLicenciaAsignada');
            const licencias = JSON.parse(localStorage.getItem('sbo_db_licencias_personalizadas')) || [];

            const licenciasValidas = licencias.filter(l => l && (l.nombreLicencia || l.nombre || l.clave));

            if (licenciasValidas.length === 0) {
                select.innerHTML = '<option value="">No hay licencias disponibles (Usá 📂 Cargar JSON)</option>';
                return;
            }

            let html = '<option value="">Seleccioná una licencia...</option>';
            licenciasValidas.forEach(l => {
                const nombre = l.nombreLicencia || l.nombre || 'Licencia';
                const clave = l.clave || '';
                html += `<option value="${nombre}" data-clave="${clave}">${nombre}</option>`;
            });
            select.innerHTML = html;
        }

        // Función para leer un archivo JSON de Licencia guardado en Descargas
        function cargarLicenciaDesdeArchivo(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    let licenciasLocales = JSON.parse(localStorage.getItem('sbo_db_licencias_personalizadas')) || [];
                    
                    let nuevasAgregadas = 0;
                    let nombreSeleccionado = "";

                    const procesarLicencia = (item) => {
                        if (!item) return;
                        const nombreL = item.nombreLicencia || item.nombre;
                        if (!nombreL) return;

                        // Verificar si no está repetida por ID o por nombre
                        const existe = licenciasLocales.some(l => l.id === item.id || (l.nombreLicencia || l.nombre) === nombreL);
                        if (!existe) {
                            licenciasLocales.push(item);
                            nuevasAgregadas++;
                        }
                        nombreSeleccionado = nombreL;
                    };

                    if (Array.isArray(data)) {
                        data.forEach(item => procesarLicencia(item));
                    } else if (typeof data === 'object') {
                        procesarLicencia(data);
                    }

                    if (nuevasAgregadas > 0 || nombreSeleccionado) {
                        localStorage.setItem('sbo_db_licencias_personalizadas', JSON.stringify(licenciasLocales));
                        cargarSelectLicencias();
                        
                        // Seleccionar la licencia recién cargada
                        if (nombreSeleccionado) {
                            document.getElementById('selLicenciaAsignada').value = nombreSeleccionado;
                            document.getElementById('selLicenciaAsignada').dispatchEvent(new Event('change'));
                        }
                        
                        alert('¡Licencia cargada con éxito desde el archivo JSON!');
                    } else {
                        alert('El archivo JSON no contiene licencias válidas o ya existía en la lista.');
                    }
                } catch (err) {
                    console.error(err);
                    alert('Error al leer el archivo JSON de licencia.');
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Resetear el input para poder reimportar el mismo archivo si se requiere
        }

        function obtenerAcronimo(texto, valorDefecto = 'CLI') {
            if (!texto || !texto.trim()) return valorDefecto;
            
            const palabras = texto.trim().toUpperCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .split(/\s+/);
                
            const ignorar = ["DE", "DEL", "LA", "EL", "LOS", "LAS", "Y", "A", "POR", "UN", "UNA"];
            const filtradas = palabras.filter(p => !ignorar.includes(p) && p.length > 0);
            
            if (filtradas.length === 0) return valorDefecto;
            return filtradas.map(p => p[0]).join('');
        }

        function extraerFragmentoHardware(hw) {
            if (!hw || !hw.trim()) return 'GEN';
            let limpio = hw.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (limpio.startsWith('HW')) {
                limpio = limpio.substring(2);
            }
            if (limpio.length >= 4) {
                let mitad = Math.floor(limpio.length / 2);
                let inicio = Math.max(0, mitad - 2);
                return limpio.substr(inicio, 4);
            }
            return limpio || 'GEN';
        }

        function generarClaveAlta() {
            const selectLicencia = document.getElementById('selLicenciaAsignada');
            const nombreLicencia = selectLicencia.value;
            const nombreCliente = document.getElementById('txtNombreCliente').value.trim();
            let huellaHardware = document.getElementById('txtHardware').value.trim();

            if (!nombreLicencia) {
                alert('¡Che, elegí una licencia del desplegable primero!');
                return;
            }

            const acronimoLicencia = obtenerAcronimo(nombreLicencia, 'LIC');
            const acronimoCliente = obtenerAcronimo(nombreCliente, 'CLI');
            const hwCorto = extraerFragmentoHardware(huellaHardware);

            const claveGenerada = `${acronimoLicencia}-${hwCorto}-${acronimoCliente}`.toUpperCase();
            document.getElementById('txtClaveLicencia').value = claveGenerada;
        }

        function formatearFechaAR(fechaStr) {
            if (!fechaStr) return '-';
            const partes = fechaStr.split('-');
            if (partes.length === 3) {
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
            return fechaStr;
        }

        document.getElementById('formCliente').addEventListener('submit', function(e) {
            e.preventDefault();
            const nombreCliente = document.getElementById('txtNombreCliente').value.trim();
            const contacto = document.getElementById('txtContacto').value.trim() || '2364502082';
            const email = document.getElementById('txtEmail').value.trim();
            const domicilio = document.getElementById('txtDomicilio').value.trim();
            const hardware = document.getElementById('txtHardware').value.trim() || 'HWGEN';
            const licenciaSeleccionada = document.getElementById('selLicenciaAsignada').value;
            const claveLicencia = document.getElementById('txtClaveLicencia').value.trim().toUpperCase();
            const fechaInicio = document.getElementById('txtFechaInicio').value;
            const fechaFin = document.getElementById('txtFechaFin').value;

            if (!licenciaSeleccionada) {
                alert('Por favor elegí una licencia válida.');
                return;
            }

            const datosConfig = {
                id: Date.now(),
                nombreCliente,
                contacto,
                email,
                domicilio,
                hardware,
                licencia: licenciaSeleccionada,
                clave: claveLicencia || 'SIN-CLAVE',
                fechaInicio,
                fechaFin
            };

            const jsonString = JSON.stringify(datosConfig, null, 2);
            ultimoArchivoBlob = new Blob([jsonString], { type: 'application/json' });
            
            const limpiarNombre = nombreCliente.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]/g, '_')
                .replace(/_+/g, '_');
            
            ultimoNombreArchivo = `${limpiarNombre}.sbo`;

            const url = URL.createObjectURL(ultimoArchivoBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = ultimoNombreArchivo;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // Respaldo local en localStorage
            let clientes = JSON.parse(localStorage.getItem('sbo_db_clientes')) || [];
            const nuevoRegistro = {
                ...datosConfig,
                fechaRegistro: new Date().toLocaleDateString('es-AR')
            };
            clientes.push(nuevoRegistro);
            localStorage.setItem('sbo_db_clientes', JSON.stringify(clientes));

            let clavesCreadas = JSON.parse(localStorage.getItem('sbo_db_claves_creadas')) || [];
            clavesCreadas.unshift({
                id: nuevoRegistro.id,
                cliente: nombreCliente,
                hardware: hardware,
                licencia: licenciaSeleccionada,
                clave: claveLicencia || 'SIN-CLAVE'
            });
            localStorage.setItem('sbo_db_claves_creadas', JSON.stringify(clavesCreadas));
            
            this.reset();
            document.getElementById('txtContacto').value = '2364502082';
            document.getElementById('txtFechaInicio').value = new Date().toISOString().split('T')[0];
            cargarSelectLicencias();
            
            const textoMensaje = `¡Hola ${nombreCliente}! 👋 Acá te envío tu licencia oficial para *SBO Control*.\n\n` +
                `📋 *Detalles de tu cuenta:*\n` +
                `• Licencia: ${licenciaSeleccionada}\n` +
                `• Clave de Acceso: *${claveLicencia || 'SIN-CLAVE'}*\n\n` +
                `----------------------------------------\n` +
                `📥 *IMPORTANTE - PASOS A SEGUIR:*\n` +
                `1️⃣ Descargá el archivo adjunto (*${ultimoNombreArchivo}*).\n` +
                `   *(📌 Lo vas a encontrar en la carpeta: Almacenamiento interno -> WhatsApp -> Media -> WhatsApp Documents)*\n` +
                `2️⃣ Entrá a la aplicación SBO Control en tu celular.\n` +
                `3️⃣ En la pantalla principal, tocá el botón azul *'📥 Importar Archivo .sbo'* y buscalo ahí.\n` +
                `4️⃣ ¡Listo! La app configurará tu acceso de forma automática para empezar a usarla.\n` +
                `----------------------------------------\n` +
                `🚨 *¡ATENCIÓN!* NO BORRES este mensaje ni el archivo adjunto por nada del mundo, ya que te sirve como respaldo de seguridad de tu licencia.\n` +
                `----------------------------------------\n` +
                `Cualquier duda, escribime por acá. ¡Muchas gracias! 🙌`;

            navigator.clipboard.writeText(textoMensaje).then(() => {
                let telefonoLimpio = contacto.replace(/[^0-9]/g, '');
                const urlWa = `https://api.whatsapp.com/send?phone=${telefonoLimpio}&text=` + encodeURIComponent(textoMensaje);
                
                let abrirWpp = confirm(`¡Cliente registrado localmente y archivo .sbo descargado!\n\n📋 El mensaje se COPIÓ AL PORTAPAPELES.\n\n¿Querés abrir WhatsApp ahora?`);
                if (abrirWpp) {
                    window.open(urlWa, '_blank');
                }
            }).catch(err => {
                alert('Cliente registrado, pero falló al copiar al portapapeles.');
            });

            abrirModalClientes();
        });

        function cargarClientes() {
            const contenedor = document.getElementById('contenedorClientes');
            const clientes = JSON.parse(localStorage.getItem('sbo_db_clientes')) || [];

            if (clientes.length === 0) {
                contenedor.innerHTML = '<div style="text-align:center; color:#666; font-size:12px; padding:20px 0;">No hay clientes registrados todavía.</div>';
                return;
            }

            let html = '';
            clientes.forEach(c => {
                html += `
                    <div class="cliente-item">
                        <div class="cliente-info">
                            <strong>${c.nombreCliente}</strong>
                            <p>📞 Tel: ${c.contacto} | ✉️ ${c.email || 'Sin Email'}</p>
                            <p>🏠 Dir: ${c.domicilio}</p>
                            <p>💻 HW: ${c.hardware || 'HWGEN'}</p>
                            <p>🔑 Lic: <strong>${c.licencia}</strong> (${c.clave || 'Sin Clave'})</p>
                            <p>📅 Vigencia: <strong>${formatearFechaAR(c.fechaInicio)}</strong> al <strong>${formatearFechaAR(c.fechaFin)}</strong></p>
                        </div>
                        <button class="btn-eliminar" onclick="eliminarCliente(${c.id})">🗑️</button>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
        }

        window.eliminarCliente = function(id) {
            if(!confirm('¿Estás seguro de eliminar este registro?')) return;
            let clientes = JSON.parse(localStorage.getItem('sbo_db_clientes')) || [];
            clientes = clientes.filter(c => c.id !== id);
            localStorage.setItem('sbo_db_clientes', JSON.stringify(clientes));

            let claves = JSON.parse(localStorage.getItem('sbo_db_claves_creadas')) || [];
            claves = claves.filter(c => c.id !== id);
            localStorage.setItem('sbo_db_claves_creadas', JSON.stringify(claves));

            cargarClientes();
        };
    </script>
</body>
</html>
