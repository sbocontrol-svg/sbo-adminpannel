<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.B.O. Control - Alta de Cliente</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1b2a; color: #333; padding: 12px; display: flex; justify-content: center; }
        .container { background-color: #f8f9fa; width: 100%; max-width: 480px; border-radius: 20px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .brand h1 { font-size: 17px; color: #00796b; font-weight: 700; }
        .brand p { font-size: 11px; color: #666; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #333; margin-bottom: 4px; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: white; }
        .form-row { display: flex; gap: 8px; }
        .form-row .form-group { flex: 1; }
        .btn-primary { background-color: #2e7d32; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 4px; }
        .btn-primary:hover { background-color: #1b5e20; }
        .btn-pdf { background-color: #0277bd; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 8px; text-align: center; }
        .btn-pdf:hover { background-color: #01579b; }
        .btn-volver { background-color: #546e7a; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; display: block; text-align: center; margin-top: 10px; }
        .lista-clientes { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
        .cliente-item { background: white; border: 1px solid #eee; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .cliente-info strong { color: #00796b; display: block; font-size: 13px; }
        .cliente-info p { color: #666; font-size: 11px; margin-top: 2px; }
        .btn-eliminar { background: #ffebee; color: #c62828; border: none; padding: 6px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-eliminar:hover { background: #ffcdd2; }

        @media print {
            body { background: white !important; padding: 0 !important; }
            .container { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; }
            #formCliente, .btn-volver, .btn-eliminar, .btn-pdf { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <h1>Alta de Cliente</h1>
                <p>S. B. O. Control</p>
            </div>
            <span style="font-size: 24px;">👤</span>
        </div>

        <form id="formCliente">
            <div class="form-group">
                <label>1. Nombre y Apellido del Cliente:</label>
                <input type="text" id="txtNombreCliente" class="form-control" placeholder="Ej: Carlos Gómez" required>
            </div>
            <div class="form-group">
                <label>2. WhatsApp / Contacto:</label>
                <input type="text" id="txtContacto" class="form-control" placeholder="Ej: +54 9 2364..." required>
            </div>
            <div class="form-group">
                <label>3. Domicilio / Ciudad:</label>
                <input type="text" id="txtDomicilio" class="form-control" placeholder="Ej: Av. San Martín 123, Junín" required>
            </div>
            <div class="form-group">
                <label>4. Tipo de Licencia:</label>
                <select id="selLicenciaAsignada" class="form-control" required>
                    <option value="">Cargando licencias...</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>5. Desde la Fecha:</label>
                    <input type="date" id="txtFechaInicio" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>6. Hasta la Fecha:</label>
                    <input type="date" id="txtFechaFin" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn-primary">💾 Registrar Cliente</button>
        </form>

        <h3 style="font-size: 14px; color: #0d47a1; margin-top: 16px; margin-bottom: 8px;">Clientes Registrados</h3>
        <div class="lista-clientes" id="contenedorClientes">
            <!-- Se carga dinámicamente -->
        </div>

        <button class="btn-pdf" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
        <a href="menu.html" class="btn-volver">⬅️ Volver al Menú</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Seteamos la fecha de inicio con el día de hoy por defecto
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('txtFechaInicio').value = hoy;
            
            cargarSelectLicencias();
            cargarClientes();
        });

        function cargarSelectLicencias() {
            const select = document.getElementById('selLicenciaAsignada');
            const licencias = JSON.parse(localStorage.getItem('sbo_db_licencias_personalizadas')) || [];

            const licenciasFiltradas = licencias.filter(l => 
                !l.clave.includes('LVDPV') && 
                !l.nombreLicencia.toLowerCase().includes('por vida')
            );

            if (licenciasFiltradas.length === 0) {
                select.innerHTML = '<option value="">No hay licencias disponibles</option>';
                return;
            }

            let html = '<option value="">Seleccioná una licencia...</option>';
            licenciasFiltradas.forEach(l => {
                html += `<option value="${l.nombreLicencia} - ${l.clave}">${l.nombreLicencia} (Clave: ${l.clave})</option>`;
            });
            select.innerHTML = html;
        }

        document.getElementById('formCliente').addEventListener('submit', function(e) {
            e.preventDefault();
            const nombreCliente = document.getElementById('txtNombreCliente').value.trim();
            const contacto = document.getElementById('txtContacto').value.trim();
            const domicilio = document.getElementById('txtDomicilio').value.trim();
            const licenciaSeleccionada = document.getElementById('selLicenciaAsignada').value;
            const fechaInicio = document.getElementById('txtFechaInicio').value;
            const fechaFin = document.getElementById('txtFechaFin').value;

            if (!licenciaSeleccionada) {
                alert('Por favor elegí una licencia válida.');
                return;
            }

            let clientes = JSON.parse(localStorage.getItem('sbo_db_clientes')) || [];
            
            clientes.push({
                id: Date.now(),
                nombreCliente,
                contacto,
                domicilio,
                licencia: licenciaSeleccionada,
                fechaInicio,
                fechaFin,
                fechaRegistro: new Date().toLocaleDateString()
            });

            localStorage.setItem('sbo_db_clientes', JSON.stringify(clientes));
            
            this.reset();
            // Volver a poner la fecha de hoy por defecto después del reset
            document.getElementById('txtFechaInicio').value = new Date().toISOString().split('T')[0];
            cargarSelectLicencias();
            cargarClientes();
            alert('¡Cliente registrado con éxito!');
        });

        function cargarClientes() {
            const contenedor = document.getElementById('contenedorClientes');
            const clientes = JSON.parse(localStorage.getItem('sbo_db_clientes')) || [];

            if (clientes.length === 0) {
                contenedor.innerHTML = '<div style="text-align:center; color:#666; font-size:12px; padding:10px;">No hay clientes registrados todavía.</div>';
                return;
            }

            let html = '';
            clientes.forEach(c => {
                html += `
                    <div class="cliente-item">
                        <div class="cliente-info">
                            <strong>${c.nombreCliente}</strong>
                            <p>Tel: ${c.contacto} | Dir: ${c.domicilio}</p>
                            <p>Lic: ${c.licencia}</p>
                            <p>Vigencia: <strong>${c.fechaInicio || '-'}</strong> al <strong>${c.fechaFin || '-'}</strong></p>
                        </div>
                        <button class="btn-eliminar" onclick="eliminarCliente(${c.id})">✕</button>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
        }

        window.eliminarCliente = function(id) {
            if(!confirm('¿Estás seguro de eliminar este registro?')) return;
            let clientes = JSON.parse(localStorage.getItem('sbo_db_clientes')) || [];
            clientes = clientes.filter(c => c.id !== id);
            localStorage.setItem('sbo_db_clientes', JSON.stringify(clientes));
            cargarClientes();
        };
    </script>
</body>
</html>
